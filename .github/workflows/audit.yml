          grep -q "CLUBE TAMÃO" /tmp/club.html
          grep -q "Seu próximo convite pode abrir novas portas." /tmp/refer.html
          grep -q "Sua revenda, mais fácil de encontrar." /tmp/merchants.html
          grep -q "Sua marca pode fazer parte das escolhas que movem a cidade." /tmp/sponsors.html
          grep -q "FAÇA AS CONTAS DO SEU JEITO" /tmp/merchants.html
          grep -q "Quer vender pelo TAMÃO?" /tmp/merchants.html
          grep -q "Quero levar minha empresa ao TAMÃO" /tmp/merchants.html
          grep -q "VENDA PELO TAMÃO" /tmp/merchants.html
          grep -q "Aviso de Privacidade" /tmp/privacy.html
