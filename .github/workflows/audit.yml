name: Audit

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Syntax check
        run: |
          for f in js/*.js tests/*.mjs scripts/*.mjs $(find supabase/functions -type f -name '*.js' 2>/dev/null); do
            echo "Checking $f"
            node --check "$f"
          done
      - name: Browser SDK integrity verify
        run: |
          EXPECTED='sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok'
          curl --fail --silent --show-error --location \
            --retry 4 --retry-all-errors --retry-delay 1 --connect-timeout 10 --max-time 60 \
            'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js' \
            --output /tmp/supabase-browser.js
          ACTUAL="sha384-$(openssl dgst -sha384 -binary /tmp/supabase-browser.js | openssl base64 -A)"
          echo "SUPABASE_BROWSER_SHA384=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
      - name: Edge Functions type and secret audit
        run: |
          if find supabase/functions -type f -name '*.ts' | grep -q .; then
            deno check $(find supabase/functions -type f -name '*.ts' | sort)
          fi
          if grep -RInE 'sb_secret_[A-Za-z0-9_-]+|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=[[:space:]]*["'\'' ]*[A-Za-z0-9._-]+' supabase/functions --include='*.ts' --include='*.js'; then
            echo "Secret-like value detected in Edge Function source"
            exit 1
          fi
          ADMIN_AUTH='supabase/functions/admin-auth/index.ts'
          grep -q 'const ADMIN_LIVE_ORIGIN="https://admin.tamao.com.br"' "$ADMIN_AUTH" || { echo "admin-auth missing official origin"; exit 1; }
          grep -q 'const ADMIN_PAGES_ORIGIN="https://tamao-sg-admin.pages.dev"' "$ADMIN_AUTH" || { echo "admin-auth missing Cloudflare Pages origin"; exit 1; }
          if grep -qE 'localhost|127\\.0\\.0\\.1|ADMIN_ALLOWED_ORIGIN|chama-sg-admin\\.netlify\\.app' "$ADMIN_AUTH"; then
            echo "admin-auth contains non-production or legacy admin origin"
            exit 1
          fi
          for f in $(find supabase/functions -mindepth 2 -maxdepth 2 -name 'index.ts' | sort); do
            case "$f" in
              supabase/functions/capture-prelaunch-lead/index.ts)
                grep -q 'ALLOWED_ORIGINS' "$f" || { echo "$f missing explicit origin allowlist"; exit 1; }
                grep -q 'capture_prelaunch_lead_idempotent' "$f" || { echo "$f missing transactional lead authority"; exit 1; }
                grep -q 'consume_prelaunch_lead_quota' supabase/migrations/20261006153000_lead_retry_ordering_v1_70_26.sql || { echo "$f transactional authority missing server-side rate limit"; exit 1; }
                grep -q 'body.consent!==true' "$f" || { echo "$f missing explicit consent gate"; exit 1; }
                grep -q 'body.website' "$f" || { echo "$f missing honeypot"; exit 1; }
                grep -q 'raw.length>16000' "$f" || { echo "$f missing payload cap"; exit 1; }
                ;;
              supabase/functions/submit-public-request/index.ts)
                grep -q 'ALLOWED_ORIGINS' "$f" || { echo "$f missing explicit origin allowlist"; exit 1; }
                grep -q 'consume_prelaunch_lead_quota' "$f" || { echo "$f missing server-side rate limit"; exit 1; }
                grep -q 'body.acknowledged!==true' "$f" || { echo "$f missing acknowledgement gate"; exit 1; }
                grep -q 'body.website' "$f" || { echo "$f missing honeypot"; exit 1; }
                grep -q 'raw.length>16000' "$f" || { echo "$f missing payload cap"; exit 1; }
                ;;
              supabase/functions/capture-marketing-event/index.ts)
                grep -q 'ALLOWED_ORIGINS' "$f" || { echo "$f missing explicit origin allowlist"; exit 1; }
                grep -q 'consume_prelaunch_lead_quota' "$f" || { echo "$f missing server-side rate limit"; exit 1; }
                grep -q 'EVENT_TYPES' "$f" || { echo "$f missing event allowlist"; exit 1; }
                grep -q 'raw.length>6000' "$f" || { echo "$f missing payload cap"; exit 1; }
                grep -q 'record_prelaunch_marketing_event' "$f" || { echo "$f missing aggregate RPC"; exit 1; }
                ;;
              supabase/functions/billing-payment-webhook/index.ts)
                grep -q 'x-tamao-signature' "$f" || { echo "$f missing webhook signature header"; exit 1; }
                grep -q 'hmacSha256Hex' "$f" || { echo "$f missing HMAC verification"; exit 1; }
                grep -q 'constantTimeEqualHex' "$f" || { echo "$f missing constant-time signature comparison"; exit 1; }
                grep -q 'MAX_SKEW_SECONDS=300' "$f" || { echo "$f missing anti-replay time window"; exit 1; }
                grep -q 'MAX_BODY_BYTES=16384' "$f" || { echo "$f missing payload cap"; exit 1; }
                grep -q 'BILLING_PAYMENT_WEBHOOK_SECRETS' "$f" || { echo "$f missing provider secret map"; exit 1; }
                grep -q 'ingest_merchant_billing_payment_event' "$f" || { echo "$f missing server-side payment event authority"; exit 1; }
                grep -q '\[functions.billing-payment-webhook\]' supabase/config.toml || { echo "$f missing config.toml entry"; exit 1; }
                ;;
              supabase/functions/billing-payment-webhook-woovi/index.ts)
                grep -q 'x-webhook-signature' "$f" || { echo "$f missing Woovi RSA signature header"; exit 1; }
                grep -q 'WOOVI_WEBHOOK_AUTHORIZATION' "$f" || { echo "$f missing private webhook authorization binding"; exit 1; }
                grep -q 'WOOVI_COMPANY_ID' "$f" || { echo "$f missing company binding"; exit 1; }
                grep -q 'RSASSA-PKCS1-v1_5' "$f" || { echo "$f missing RSA-SHA256 verification"; exit 1; }
                grep -q 'webhook/public-keys' "$f" || { echo "$f missing Woovi public-key rotation endpoint"; exit 1; }
                grep -q 'OPENPIX:TRANSACTION_RECEIVED' "$f" || { echo "$f missing Pix-received event allowlist"; exit 1; }
                grep -q 'endToEndId' "$f" || { echo "$f missing Pix reconciliation identifier"; exit 1; }
                grep -q 'MAX_BODY_BYTES=65536' "$f" || { echo "$f missing raw payload cap"; exit 1; }
                grep -q 'ingest_merchant_billing_payment_event' "$f" || { echo "$f missing server-side payment event authority"; exit 1; }
                grep -q '\[functions.billing-payment-webhook-woovi\]' supabase/config.toml || { echo "$f missing config.toml entry"; exit 1; }
                ;;
              *)
                grep -q 'auth.getUser' "$f" || { echo "$f missing explicit JWT user validation"; exit 1; }
                ;;
            esac
          done
      - name: Marketplace simulations
        run: node tests/simulations.mjs
      - name: Expert deterministic fuzz
        run: node tests/expert-fuzz.mjs
      - name: Financial invariant fuzz
        run: node tests/financial-invariants-fuzz.mjs
      - name: Service worker cache integrity
        run: node tests/service-worker-integrity.mjs
      - name: Static trust and asset audit
        run: node tests/static-audit.mjs
      - name: Remote admin gateway contract and portal report
        run: node tests/remote-admin-readiness.mjs
      - name: Runtime origin config contract
        run: node tests/runtime-config.mjs
      - name: Live portal bundle contract
        run: node tests/live-portals.mjs
      - name: Netlify zero-config bundle contract
        env:
          CHAMA_CUSTOMER_ORIGIN: https://chama-sg-cliente.netlify.app
          CHAMA_MERCHANT_ORIGIN: https://chama-sg-revenda.netlify.app
          CHAMA_ADMIN_ORIGIN: https://chama-sg-admin.netlify.app
          CHAMA_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          CHAMA_ALLOW_TEST_TURNSTILE: '1'
          SITE_NAME: chama-sg-admin
          CHAMA_SOURCE_SHA: ci-netlify-zero-config
        run: |
          node scripts/build-netlify-portal.mjs
          test -f dist/netlify/index.html
          test -f dist/netlify/portal-build.json
          grep -q '"portalRole": "admin"' dist/netlify/portal-build.json
          grep -q '"sourceSha": "ci-netlify-zero-config"' dist/netlify/portal-build.json
          grep -q 'data-chama-portal="admin"' dist/netlify/index.html
          test ! -e dist/netlify/supabase
          test ! -e dist/netlify/tests
          test ! -e dist/netlify/scripts
      - name: Backend security contract
        run: node tests/backend-contract.mjs
      - name: Runtime migration contract
        run: node tests/runtime-migration-contract.mjs
      - name: Runtime operations contract
        run: node tests/runtime-operations-contract.mjs
      - name: Server domain simulations
        run: node tests/server-domain.mjs
      - name: Public artifact boundary
        run: |
          node scripts/build-public-site.mjs /tmp/tamao-public
          TAMAO_DEPLOY_TARGET=cloudflare node scripts/build-public-site.mjs /tmp/tamao-cloudflare-prelaunch
          test -f /tmp/tamao-cloudflare-prelaunch/_headers
          grep -q "X-Robots-Tag: noindex" /tmp/tamao-cloudflare-prelaunch/_headers
          grep -q "Disallow: /" /tmp/tamao-cloudflare-prelaunch/robots.txt
          test ! -e /tmp/tamao-cloudflare-prelaunch/sitemap.xml
          TAMAO_DEPLOY_TARGET=cloudflare TAMAO_PUBLIC_INDEXING=1 node scripts/build-public-site.mjs /tmp/tamao-cloudflare-public
          grep -q 'name="robots" content="index,follow"' /tmp/tamao-cloudflare-public/index.html
          grep -q "Allow: /" /tmp/tamao-cloudflare-public/robots.txt
          test -f /tmp/tamao-cloudflare-public/sitemap.xml
          ! grep -q "X-Robots-Tag: noindex" /tmp/tamao-cloudflare-public/_headers
          if TAMAO_DEPLOY_TARGET=cloudflare TAMAO_LIVE_RUNTIME=1 node scripts/build-public-site.mjs /tmp/tamao-live-invalid; then
            echo "live runtime não pode buildar sem origins/Turnstile"
            exit 1
          fi
      - name: Browser smoke — mobile routes
        run: |
          python3 -m http.server 4173 >/tmp/chama-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          for route in home learn earn order club refer merchants privacy terms contact merchant admin; do
            "$CHROME" --headless=new --no-sandbox --disable-gpu --window-size=360,800 --virtual-time-budget=1200 --user-data-dir="/tmp/chrome-$route" --dump-dom "http://127.0.0.1:4173/#$route" > "/tmp/$route.html"
          done
          grep -Fq "Pediu? Tá na mão." /tmp/home.html
          grep -q "PROTEÇÃO TAMÃO" /tmp/home.html
          grep -q "Botijão de cozinha 13 kg" /tmp/home.html
          grep -q "Quero ser avisado na abertura" /tmp/home.html
          grep -q "ONDE ESTAMOS AGORA" /tmp/home.html
          grep -q "Primeiro parceiro piloto em preparação" /tmp/home.html
          grep -q "Quero comprar" /tmp/home.html
          grep -q "Quero vender no TAMÃO" /tmp/home.html
          grep -q "Antes de pedir, veja quanto custa" /tmp/learn.html
          grep -q "Comissão por indicação para pessoas" /tmp/earn.html
          grep -q "O que você precisa e onde devemos entregar" /tmp/order.html
          grep -q "Clube TAMÃO" /tmp/club.html
          grep -q "Indique um novo comprador" /tmp/refer.html
          grep -q "Transforme capacidade de entrega em novas vendas" /tmp/merchants.html
          grep -q "SIMULADOR DE MARGEM INCREMENTAL" /tmp/merchants.html
          grep -q "Cadastre o interesse em menos de 1 minuto" /tmp/merchants.html
          grep -q "Quero ser parceiro fundador" /tmp/merchants.html
          grep -q "PARCEIRO FUNDADOR" /tmp/merchants.html
          grep -q "Aviso de Privacidade" /tmp/privacy.html
          grep -q "Seus direitos" /tmp/privacy.html
          grep -q "Termos de Uso" /tmp/terms.html
          grep -q "Fale com o TAMÃO" /tmp/contact.html
          grep -q "Privacidade / LGPD" /tmp/contact.html
          grep -q "Acesso operacional real" /tmp/merchant.html
          ! grep -q "PAINEL DA REVENDA — DEMONSTRAÇÃO" /tmp/merchant.html
          ! grep -q "Revenda Parceira A" /tmp/merchant.html
          grep -q "Administração só está disponível" /tmp/admin.html
      - name: Browser E2E — 320/360/390 px
        run: |
          python3 -m http.server 4173 >/tmp/chama-e2e-http.log 2>&1 &
          SERVER_PID=$!
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          for spec in "320:800:9222" "360:800:9223" "390:844:9224"; do
            IFS=: read -r WIDTH HEIGHT PORT <<< "$spec"
            DIR="/tmp/chama-e2e-chrome-$WIDTH"
            LOG="/tmp/chama-e2e-chrome-$WIDTH.log"
            "$CHROME" --headless=new --no-sandbox --disable-gpu --window-size="$WIDTH,$HEIGHT" --remote-debugging-port="$PORT" --user-data-dir="$DIR" about:blank >"$LOG" 2>&1 &
            CHROME_PID=$!
            sleep 2
            CHROME_DEBUG="http://127.0.0.1:$PORT" node tests/browser-e2e.mjs
            kill "$CHROME_PID" 2>/dev/null || true
            wait "$CHROME_PID" 2>/dev/null || true
          done
      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest OK')"
