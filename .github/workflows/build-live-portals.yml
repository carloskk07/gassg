name: Build isolated live portals

on:
  workflow_dispatch:
    inputs:
      turnstile_site_key:
        description: 'Cloudflare Turnstile site key pública das origens live'
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'css/**'
      - 'js/**'
      - 'icons/**'
      - 'scripts/build-live-portals.mjs'
      - 'scripts/generate-runtime-config.mjs'
      - 'tests/live-portals.mjs'
      - '.github/workflows/build-live-portals.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'css/**'
      - 'js/**'
      - 'icons/**'
      - 'scripts/build-live-portals.mjs'
      - 'scripts/generate-runtime-config.mjs'
      - 'tests/live-portals.mjs'
      - '.github/workflows/build-live-portals.yml'

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CHAMA_CUSTOMER_ORIGIN: https://chama-sg-cliente.netlify.app
      CHAMA_MERCHANT_ORIGIN: https://chama-sg-revenda.netlify.app
      CHAMA_ADMIN_ORIGIN: https://chama-sg-admin.netlify.app
      # Cloudflare's documented visible test site key. This job only validates
      # the bundle builder and never uploads a production artifact.
      CHAMA_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      CHAMA_ALLOW_TEST_TURNSTILE: '1'
      CHAMA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
      - name: Runtime config contracts
        run: node tests/runtime-config.mjs
      - name: Live portal bundle contracts
        run: node tests/live-portals.mjs
      - name: Build disposable test bundles
        run: node scripts/build-live-portals.mjs
      - name: Verify isolated test bundles
        run: |
          for role in customer merchant admin; do
            test -f "dist/live-portals/$role/index.html"
            test -f "dist/live-portals/$role/js/runtime-config.js"
            test -f "dist/live-portals/$role/portal-build.json"
            test ! -e "dist/live-portals/$role/supabase"
            test ! -e "dist/live-portals/$role/tests"
            grep -q "globalThis.CHAMA_PORTAL_ROLE=\"$role\"" "dist/live-portals/$role/js/runtime-config.js"
            grep -q "1x00000000000000000000AA" "dist/live-portals/$role/js/runtime-config.js"
          done
      - name: Prove test bundles are not publishable artifacts
        run: |
          test "$CHAMA_ALLOW_TEST_TURNSTILE" = "1"
          test "$CHAMA_TURNSTILE_SITE_KEY" = "1x00000000000000000000AA"
          echo "Disposable test bundles validated; nothing is uploaded."

  production-bundle:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    env:
      CHAMA_CUSTOMER_ORIGIN: https://chama-sg-cliente.netlify.app
      CHAMA_MERCHANT_ORIGIN: https://chama-sg-revenda.netlify.app
      CHAMA_ADMIN_ORIGIN: https://chama-sg-admin.netlify.app
      CHAMA_TURNSTILE_SITE_KEY: ${{ inputs.turnstile_site_key }}
      CHAMA_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
      - name: Require real Turnstile configuration
        run: |
          test -n "$CHAMA_TURNSTILE_SITE_KEY"
          case "$CHAMA_TURNSTILE_SITE_KEY" in
            1x00000000000000000000AA|2x00000000000000000000AB|3x00000000000000000000FF|0x4AAAAAAAAAA-demo-site-key)
              echo "Turnstile test/demo key cannot produce production portal artifacts."
              exit 1
              ;;
          esac
      - name: Build production bundles
        run: node scripts/build-live-portals.mjs
      - name: Verify production bundle metadata
        run: |
          for role in customer merchant admin; do
            test -f "dist/live-portals/$role/portal-build.json"
            grep -q "\"portalRole\": \"$role\"" "dist/live-portals/$role/portal-build.json"
            grep -q "\"sourceSha\": \"$CHAMA_SOURCE_SHA\"" "dist/live-portals/$role/portal-build.json"
            grep -q "$CHAMA_TURNSTILE_SITE_KEY" "dist/live-portals/$role/js/runtime-config.js"
            ! grep -Eq "1x00000000000000000000AA|2x00000000000000000000AB|3x00000000000000000000FF|0x4AAAAAAAAAA-demo-site-key" "dist/live-portals/$role/js/runtime-config.js"
          done
      - name: Create immutable handoff checksums
        run: |
          for role in customer merchant admin; do
            (
              cd "dist/live-portals/$role"
              find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
              sha256sum -c SHA256SUMS.txt
            )
          done
      - name: Upload customer production portal
        uses: actions/upload-artifact@v4
        with:
          name: tamao-live-customer
          path: dist/live-portals/customer
          if-no-files-found: error
          retention-days: 3
      - name: Upload merchant production portal
        uses: actions/upload-artifact@v4
        with:
          name: tamao-live-merchant
          path: dist/live-portals/merchant
          if-no-files-found: error
          retention-days: 3
      - name: Upload admin production portal
        uses: actions/upload-artifact@v4
        with:
          name: tamao-live-admin
          path: dist/live-portals/admin
          if-no-files-found: error
          retention-days: 3
