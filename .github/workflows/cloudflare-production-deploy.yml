name: TAMÃO Cloudflare official production deploy

# GitHub CI builds immutable bundles; this is their authenticated Cloudflare upload.
# Pull requests never publish to production.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tamao-cloudflare-official-production
  cancel-in-progress: true

jobs:
  credential-gate:
    name: Check Cloudflare deployment authorization
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - id: gate
        name: Require two deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CF_API_TOKEN" || -z "$CF_ACCOUNT_ID" ]]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::error::Cloudflare deployment credentials missing: set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub Actions secrets. No portal changed.'
            exit 1
          fi
          if [[ ! "$CF_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::error::CLOUDFLARE_ACCOUNT_ID does not match required format.'
            exit 1
          fi
          echo 'enabled=true' >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.portalRole }} — ${{ matrix.project }}
    needs: credential-gate
    if: needs.credential-gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: tamao-sg-cliente
            portalRole: customer
          - project: tamao-sg-revenda
            portalRole: merchant
          - project: tamao-sg-admin
            portalRole: admin
    env:
      CHAMA_CLOUDFLARE_PROJECT: ${{ matrix.project }}
      CHAMA_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build real Cloudflare bundle
        run: node scripts/build-cloudflare-portal.mjs
      - name: Verify role, commit and production assets
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/cloudflare-portal/index.html
          test -f dist/cloudflare-portal/portal-build.json
          test -f dist/cloudflare-portal/js/runtime-config.js
          test -f dist/cloudflare-portal/_headers
          test ! -e dist/cloudflare-portal/supabase
          test ! -e dist/cloudflare-portal/tests
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const manifest=JSON.parse(fs.readFileSync('dist/cloudflare-portal/portal-build.json','utf8'));
          const runtime=fs.readFileSync('dist/cloudflare-portal/js/runtime-config.js','utf8');
          const expected={customer:'tamao-sg-cliente',merchant:'tamao-sg-revenda',admin:'tamao-sg-admin'};
          const project=process.env.CHAMA_CLOUDFLARE_PROJECT;
          const role=Object.keys(expected).find(x=>expected[x]===project);
          assert.ok(role,'Unknown Cloudflare Pages project');
          assert.equal(manifest.portalRole,role);
          assert.equal(manifest.sourceSha,process.env.CHAMA_SOURCE_SHA);
          assert.equal(manifest.customerOrigin,'https://tamao.com.br');
          assert.equal(manifest.merchantOrigin,'https://parceiro.tamao.com.br');
          assert.equal(manifest.adminOrigin,'https://admin.tamao.com.br');
          assert.ok(runtime.includes('0x4AAAAAAFNKDvnzxtYQ9WM2'));
          assert.ok(!/1x00000000000000000000AA|2x00000000000000000000AB|3x00000000000000000000FF/.test(runtime));
          console.log('Verified production Pages bundle for '+role+' at '+manifest.sourceSha.slice(0,12));
          NODE
      # Wrangler supports direct upload to Git-integrated Pages projects.
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.136.3'
          command: pages deploy dist/cloudflare-portal --project-name=${{ matrix.project }} --branch=main --commit-hash=${{ github.sha }}

  verify:
    name: Confirm same SHA on all official portals
    needs: publish
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Strict three-domain readiness
        env:
          TAMAO_REQUIRE_LIVE_PORTALS: '1'
          TAMAO_EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: node tests/remote-admin-readiness.mjs
