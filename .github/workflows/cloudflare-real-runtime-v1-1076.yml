name: TAMÃO real Cloudflare Pages Functions route smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'functions/**'
      - 'scripts/build-public-site.mjs'
      - 'scripts/cloudflare-functions-routes-v1-1074.mjs'
      - 'tests/cloudflare-pages-real-runtime-v1-1076.mjs'
      - '.github/workflows/cloudflare-real-runtime-v1-1076.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout the candidate
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build public Cloudflare assets without production accounts
        run: |
          set -euo pipefail
          TAMAO_DEPLOY_TARGET=cloudflare node scripts/build-public-site.mjs /tmp/tamao-native-pages-v1-1076
          test -f /tmp/tamao-native-pages-v1-1076/_routes.json
          test -f /tmp/tamao-native-pages-v1-1076/p/index.html
          test -f /tmp/tamao-native-pages-v1-1076/agenda/index.html
      - name: Start actual Cloudflare Pages Functions worker
        run: |
          set -euo pipefail
          npx --yes wrangler@4.45.0 pages dev /tmp/tamao-native-pages-v1-1076 --ip 127.0.0.1 --port 4187 > /tmp/tamao-wrangler-v1-1076.log 2>&1 &
          echo "$!" > /tmp/tamao-wrangler-v1-1076.pid
          for i in $(seq 1 60); do
            if curl -sSf --max-time 2 http://127.0.0.1:4187/ -o /dev/null; then
              echo "Wrangler Pages ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tamao-wrangler-v1-1076.log
          exit 1
      - name: Verify first-touch-preserving native routes and untouched storefront
        run: node tests/cloudflare-pages-real-runtime-v1-1076.mjs
      - name: Diagnostics when any check fails
        if: failure()
        run: |
          test ! -f /tmp/tamao-wrangler-v1-1076.log || tail -120 /tmp/tamao-wrangler-v1-1076.log
      - name: Stop local server
        if: always()
        run: |
          if test -f /tmp/tamao-wrangler-v1-1076.pid; then
            kill "$(cat /tmp/tamao-wrangler-v1-1076.pid)" || true
          fi
