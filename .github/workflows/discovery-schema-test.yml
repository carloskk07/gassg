name: TAMÃO discovery PostgreSQL contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20261018131000_discovery_shared_verticals.sql'
      - 'tests/discovery-db-integration.sql'
      - '.github/workflows/discovery-schema-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v6
      - name: Execute isolated role and publication contract
        env:
          PGPASSWORD: postgres
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGDATABASE: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/discovery-db-integration.sql
