name: TAMÃO isolated Supabase integration

on:
  pull_request:
    branches: [main]
  # Run real disposable Auth/Edge/SQL tests for EVERY PR to main. Filtering
  # by file path used to miss changes in admin-ops, payments and customer care.
  # #493: proactively exercise the real Auth/Edge/SQL journeys on a
  # disposable runner even if nobody commits or manually starts a test.
  # The public-repo standard Ubuntu runner does not access production secrets.
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tamao-isolated-supabase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # No production Supabase project id, host, secrets, provider credentials
    # or GitHub OIDC tokens may be passed into this job.
    env:
      SUPABASE_ACCESS_TOKEN: ''
      SUPABASE_DB_PASSWORD: ''
    steps:
      - uses: actions/checkout@v6
      - name: Pin Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          # CLI >=2.109 has multi-registry fallback for throttled images.
          # 2.84.2 used GHCR exclusively and isolated finance E2E could
          # not even boot Postgres on shared Actions egress.
          version: 2.122.0
      - name: Verify local owner demo launcher scripts
        run: |
          bash -n scripts/run-owner-local-demo.sh
          node --check scripts/owner-local-demo-server.mjs
          node tests/owner-local-launcher-safety.mjs
      - name: Verify disposable local setup
        run: |
          test -f supabase/config.toml
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          supabase --version
          docker info --format '{{.ServerVersion}}'
          # Ubuntu runners commonly include psql already. Avoid an unconditional
          # apt network call that can stall the entire isolated test job.
          if ! command -v psql >/dev/null 2>&1; then
            timeout 150s sudo apt-get update -qq
            timeout 120s sudo apt-get install -y -qq postgresql-client >/dev/null
          fi
          psql --version
      - name: Boot ephemeral Postgres using canonical baseline followed by migrations
        run: |
          # This project predates migration-managed bootstrap. The repo's
          # canonical supabase/schema.sql is the initial database, and the
          # earliest checked-in migration reconciles it. Put a copy only in
          # this disposable runner: never create a duplicate in Git or push it.
          first="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | LC_ALL=C sort | head -n 1)"
          test "$first" = "supabase/migrations/20261001070000_reconcile_runtime_v1_4.sql"
          test -s supabase/schema.sql
          ephemeral="supabase/migrations/20261001065000_local_baseline_from_schema.sql"
          test ! -e "$ephemeral"
          cp supabase/schema.sql "$ephemeral"
          trap 'rm -f "$ephemeral"' EXIT
          # Some committed historical files share a 14-digit migration
          # version. Normalize only this runner's filenames, preserving
          # exact SQL bytes and original sorted execution order. Never
          # publish these synthetic local versions or compare them to
          # hosted production migration-history identifiers.
          python3 - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from shutil import move
          import re
          root=Path('supabase/migrations')
          files=sorted(root.glob('*.sql'))
          if len(files)<200:
              raise RuntimeError('Unexpectedly short migration chain')
          staged=[]
          previous=None
          normalized=0
          with TemporaryDirectory() as tmp:
              for source in files:
                  match=re.fullmatch(r'(\d{14})_(.+)\.sql',source.name)
                  if not match:
                      raise RuntimeError('Migration filename not canonical: '+source.name)
                  # Migration version is a 14-digit sortable identifier,
                  # not necessarily a valid calendar time (historical
                  # filenames may use seconds > 59). Keep names monotonic.
                  original=int(match.group(1))
                  effective=original if previous is None or original>previous else previous+1
                  previous=effective
                  name=f'{effective:014d}'+'_'+match.group(2)+'.sql'
                  if name!=source.name:
                      normalized+=1
                  target=Path(tmp)/source.name
                  move(source,target)
                  staged.append((target,root/name))
              for source,target in staged:
                  move(source,target)
          print('Ephemeral migration files:',len(files),'local timestamp adjustments:',normalized)
          assert len({p.name[:14] for p in root.glob('*.sql')})==len(files)
          PY
          # Lean stack only: Auth, gateway, Data API, Edge and Postgres.
          # Does NOT open the commercial project or include any PSP account.
          # setup-cli exports SUPABASE_INTERNAL_IMAGE_REGISTRY=ghcr.io by
          # default. An explicit override DISABLES the CLI's registry
          # fallback (ECR -> GHCR -> Docker Hub); remove it ONLY for this
          # disposable local start. Do not remove payment/auth env safeguards.
          env -u SUPABASE_INTERNAL_IMAGE_REGISTRY \
            supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,logflare,vector,supavisor
      - name: Verify real schema, RLS, missing merchant and clean local orders
        run: node tests/isolated-supabase-commerce-smoke.mjs
      - name: V1.824 verify plan catalog in isolated Postgres
        run: node tests/isolated-accessible-merchant-plans-v1-824.mjs
      - name: V1.953 four prepaid plans complete request replay cancellation and synthetic credit safeguards
        run: node tests/isolated-merchant-prepaid-lifecycle-v1-953.mjs
      - name: V1.948 verified 100 welcome bonuses, 101 denied and Admin audit in rollback-only PostgreSQL
        run: node tests/isolated-welcome-first100-lifecycle-v1-948.mjs
      - name: V1.947 authoritative basket GLP versus non-GLP, ANP revocation and verified owner (ROLLBACK)
        run: |
          # Only the disposable Supabase localhost from this job.
          # No external gateway, owner identity, or production database.
          PGPASSWORD=postgres psql --host=127.0.0.1 --port=54322 \
            --username=postgres --dbname=postgres --no-psqlrc \
            --set=ON_ERROR_STOP=1 --file=tests/sql/merchant-basket-compliance-v1-158-2.sql
      - name: V1.842 real PostgreSQL consent, repeal, replay and financial isolation
        run: node tests/isolated-merchant-benefits-contract-v1-842.mjs
      - name: Verify real driver push RLS, role gates and empty transactional outbox
        run: node tests/isolated-mobility-push.mjs
      - name: Prove five real moto and car participant journeys with cancellation expiry and GPS cleanup
        run: node tests/isolated-mobility-full-lifecycle-v1-493.mjs
      - name: V1.826 confirm fare with authenticated rider and driver on isolated Postgres
        run: node tests/isolated-mobility-fare-plans-v1-826.mjs
      - name: V1.832 prove driver consent, reduced Flex fee and frozen fare terms on isolated Postgres
        run: node tests/isolated-mobility-benefits-terms-v1-832.mjs
      - name: V1.833 full bonus welcome debit, refund, final trip and double spend protection
        run: node tests/isolated-mobility-welcome-redemption-v1-833.mjs
      - name: V1.835 driver completed ride financial fee accrual and account isolation
        run: node tests/isolated-mobility-fee-accrual-v1-835.mjs
      - name: V1.837 fee Pix invoice, late payment recovery, refund and double-bill protection
        run: node tests/isolated-mobility-fee-pix-v1-837.mjs
      - name: V1.838 verified prepaid purchases, credit holds, cancellation refunds and provider reversals
        run: node tests/isolated-mobility-prepaid-credit-v1-838.mjs
      - name: Verify full-schema browser RLS ACL and privileged RPC inventory
        run: node tests/isolated-full-schema-browser-acl.mjs
      - name: Verify reviewed ACL launch gate and fail-closed policy mutation probes
        run: node tests/isolated-launch-security-fingerprint.mjs
      - name: Verify local Auth and actual Edge HTTP authentication guards
        run: node tests/isolated-supabase-http-smoke.mjs
      - name: Verify real quote to create-order to get-order against disposable database
        run: node tests/isolated-supabase-positive-checkout.mjs
      - name: V1.843 REAL partner-funded product welcome complete checkout, refund and fee settlement
        run: node tests/isolated-product-partner-welcome-v1-843.mjs
      - name: V1.844 PostgreSQL merchant capability scope, ACL, and intact paid-coupon obligations
        run: node tests/isolated-merchant-benefits-live-scope-v1-844.mjs
      - name: V1.845 PostgreSQL prospective coupon owner contract, undo, RLS and untouched legacy receivables
        run: node tests/isolated-merchant-future-coupon-contract-v1-845.mjs
      - name: Reject commercial launch from confirmed warnings without eligible supply (disposable)
        run: node tests/isolated-commercial-activation-evidence.mjs
      - name: V1.882 platform LIVE with zero revendas, physical checkout off (disposable)
        run: node tests/isolated-platform-live-v1-882.mjs
      - name: V1.884 independent no-charge ads campaign and viewability on disposable database
        run: node tests/isolated-ads-independent-delivery-v1-884.mjs
      - name: V1.885 independent Ads reversible pause and irreversible end (disposable)
        run: node tests/isolated-ads-independent-lifecycle-v1-885.mjs
      - name: V1.886 independent fixed-fee Ads, provider proof and reversal on disposable Postgres
        run: node tests/isolated-ads-independent-fixed-fee-v1-886.mjs
      - name: V1.887 owner refund request, pause and PSP-evidence-only reconciliation
        run: node tests/isolated-ads-independent-refund-review-v1-887.mjs
      - name: V1.888 verified one-shot provider refund with rollback on disposable Postgres
        run: node tests/isolated-ads-independent-provider-refund-v1-888.mjs
      - name: V1.890 independent Ads orphan checkout recovery and 72h TTL on disposable PostgreSQL
        run: node tests/isolated-ads-independent-checkout-recovery-v1-890.mjs
      - name: V1.916 founder-only institutional free Ads, no Pix or paid campaign (ROLLBACK)
        run: node tests/isolated-ads-institutional-v1-916.mjs
      - name: V1.892 founder-authorized 72h Ads test on disposable PostgreSQL (ROLLBACK)
        run: node tests/isolated-ads-independent-homologation-v1-892.mjs
      - name: Verify immutable refund facts raise PSP/manual conflicts in the existing Admin finance queue
        run: node tests/isolated-refund-provider-anchor-audit.mjs
      - name: Upload temporary visual evidence from disposable order tests
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tamao-pedidos-sinteticos-ci
          path: test-results/isolated-order-evidence/
          if-no-files-found: error
          retention-days: 5
      - name: Verify real referral payout declaration, void and finance authority without bank claims
        run: node tests/isolated-referral-payout-lifecycle.mjs
      - name: Verify real local HTTP Ajuda intake through protected Admin resolution
        run: node tests/isolated-support-positive-journey.mjs
      - name: Verify REAL coupon payment, audited net and v8 checkout on disposable full schema
        run: node tests/isolated-supabase-coupon-full-schema.mjs
      - name: V1.819 owner-signed commercial activation and emergency suspension (rolled back)
        run: node tests/isolated-supabase-clube-commercial-release-v1-819.mjs
      - name: V1.817 isolated founder guarantee readiness and fail-closed commercial gates
        run: node tests/isolated-supabase-owner-guarantee-v1-817.mjs
      - name: V1.807 disposable PostgreSQL owner-sponsored coupon race, Pix net and v8 redemption
        run: node tests/isolated-supabase-coupon-sponsor-v1-807.mjs
      - name: V1.809 disposable PostgreSQL superadmin topups and concurrent double-submit safety
        run: node tests/isolated-supabase-coupon-topups-v1-809.mjs
      - name: V1.810 real PostgreSQL any-product min order, budget and atomic checkout
        run: node tests/isolated-supabase-coupon-general-v1-810.mjs
      - name: V1.814 PostgreSQL verified owner-scoped cancellation and frozen voucher
        run: node tests/isolated-supabase-coupon-refund-v1-814.mjs
      - name: V1.846 REAL prospective partner coupon, revocation, refund rights and net fee on disposable PostgreSQL
        run: node tests/isolated-partner-coupon-financial-conservation-v1-846.mjs
      - name: V1.847 cancel paid coupon twice, restore same voucher, zero cashback leakage and preserve old ledgers
        run: node tests/isolated-partner-coupon-cancel-reissue-v1-847.mjs
      - name: V1.848 isolated partner coupon R$8.90 package, R$8.20 PSP net and R$15 discounts
        run: node tests/isolated-partner-coupon-discounted-sale-v1-848.mjs
      - name: V1.849 local signed seller agreement, buyer terms, separate catalogue and no Pix without supply
        run: node tests/isolated-partner-coupon-buyer-commercial-v1-849.mjs
      - name: V1.850 real PostgreSQL market-city supply, fresh postcode and immutable purchase region
        run: node tests/isolated-partner-coupon-buyer-region-v1-850.mjs
      - name: V1.853 quarantine off-site paid coupon after merchant withdrawal or refund request
        run: node tests/isolated-coupon-late-pix-settlement-v1-853.mjs
      - name: V1.865 PostgreSQL refund case ownership, replay and immutable review audit
        run: node tests/isolated-coupon-refund-review-claim-v1-865.mjs
      - name: V1.866 immutable financial triage and refunded coupon history on disposable PostgreSQL
        run: node tests/isolated-coupon-refund-triage-v1-866.mjs
      - name: Destroy disposable local containers even on test failure
        if: always()
        run: supabase stop --no-backup || true
