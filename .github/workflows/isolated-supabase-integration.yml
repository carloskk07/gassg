name: TAMÃO isolated Supabase integration

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/isolated-supabase-integration.yml'
      - 'tests/isolated-supabase-commerce-smoke.mjs'
      - 'supabase/config.toml'
      - 'supabase/migrations/**'
      - 'supabase/functions/create-order/**'
      - 'supabase/functions/merchant-orders/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tamao-isolated-supabase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # No production Supabase project id, host, secrets, provider credentials
    # or GitHub OIDC tokens may be passed into this job.
    env:
      SUPABASE_ACCESS_TOKEN: ''
      SUPABASE_DB_PASSWORD: ''
    steps:
      - uses: actions/checkout@v6
      - name: Pin Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Verify disposable local setup
        run: |
          test -f supabase/config.toml
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          supabase --version
          docker info --format '{{.ServerVersion}}'
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client >/dev/null
      - name: Boot ephemeral Postgres using canonical baseline followed by migrations
        run: |
          # This project predates migration-managed bootstrap. The repo's
          # canonical supabase/schema.sql is the initial database, and the
          # earliest checked-in migration reconciles it. Put a copy only in
          # this disposable runner: never create a duplicate in Git or push it.
          first="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | LC_ALL=C sort | head -n 1)"
          test "$first" = "supabase/migrations/20261001070000_reconcile_runtime_v1_4.sql"
          test -s supabase/schema.sql
          ephemeral="supabase/migrations/20261001065000_local_baseline_from_schema.sql"
          test ! -e "$ephemeral"
          cp supabase/schema.sql "$ephemeral"
          trap 'rm -f "$ephemeral"' EXIT
          supabase db start
      - name: Verify real schema, RLS, missing merchant and clean local orders
        run: node tests/isolated-supabase-commerce-smoke.mjs
      - name: Destroy disposable local containers even on test failure
        if: always()
        run: supabase stop --no-backup || true
