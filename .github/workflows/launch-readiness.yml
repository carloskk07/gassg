name: TAMÃO launch readiness

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '7,27,47 * * * *'

permissions:
  contents: read
  id-token: write

jobs:
  remote-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Strict remote live portal readiness
        env:
          TAMAO_REQUIRE_LIVE_PORTALS: '1'
          TAMAO_EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: node tests/remote-admin-readiness.mjs
      - name: Persist OIDC-backed live portal attestation
        env:
          EXPECTED_SHA: ${{ github.sha }}
          ATTEST_URL: https://lgugwujpunhslavewffd.supabase.co/functions/v1/portal-readiness-attestor
        run: |
          set -euo pipefail
          OIDC_RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=tamao-portal-attestor")"
          OIDC_TOKEN="$(printf '%s' "${OIDC_RESPONSE}" | jq -er '.value')"
          PAYLOAD="$(jq -cn --arg sha "${EXPECTED_SHA}" '{expectedSourceSha:$sha}')"
          RESULT="$(curl --fail --silent --show-error \
            --request POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "${PAYLOAD}" \
            "${ATTEST_URL}")"
          printf '%s\n' "${RESULT}" | jq -e --arg sha "${EXPECTED_SHA}" '
            .ok == true
            and .source == "github_oidc_edge"
            and .sourceSha == $sha
            and .readiness.portalsFresh == true
            and .readiness.portalsSourceSha == $sha
            and (.portals | length) == 3
          '
      - name: Direct merchant payment kill-switch gate
        run: node tests/remote-direct-payment-kill-switch.mjs
      - name: Mercado Pago PSP runtime configuration gate
        run: node tests/remote-finance-psp-readiness.mjs
      - name: Remote admin Turnstile configuration smoke
        run: node tests/remote-admin-turnstile.mjs
