name: TAMÃO launch readiness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'css/**'
      - 'js/**'
      - 'icons/**'
      - 'scripts/build-cloudflare-portal.mjs'
      - 'scripts/build-live-portals.mjs'
      - 'scripts/generate-runtime-config.mjs'
      - 'tests/remote-admin-readiness.mjs'
      - '.github/workflows/launch-readiness.yml'

permissions:
  contents: read

jobs:
  remote-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Strict remote live portal readiness
        env:
          TAMAO_REQUIRE_LIVE_PORTALS: '1'
          TAMAO_EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: node tests/remote-admin-readiness.mjs
