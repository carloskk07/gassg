name: TAMÃO launch readiness

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  remote-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Strict remote live portal readiness
        env:
          TAMAO_REQUIRE_LIVE_PORTALS: '1'
          TAMAO_EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: node tests/remote-admin-readiness.mjs
      - name: Mercado Pago PSP runtime configuration gate
        run: node tests/remote-finance-psp-readiness.mjs
      - name: Remote admin Turnstile configuration smoke
        run: node tests/remote-admin-turnstile.mjs
