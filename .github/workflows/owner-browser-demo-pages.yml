name: TAMÃO browser-only demonstration (GitHub Pages)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/owner-browser-demo-pages.yml'
      - 'scripts/build-owner-browser-demo.mjs'
      - 'scripts/demo-browser-panel.js'
      - 'index.html'
      - 'js/**'
      - 'css/**'
      - 'icons/**'
      - 'assets/**'
      - 'manifest.webmanifest'
      - 'tests/browser-demo-cloud-smoke.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/owner-browser-demo-pages.yml'
      - 'scripts/build-owner-browser-demo.mjs'
      - 'scripts/demo-browser-panel.js'
      - 'tests/browser-demo-cloud-smoke.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Build safe owner browser demo (NO Supabase, NO local Docker)
        run: node scripts/build-owner-browser-demo.mjs _site
      - name: Browser demo safety contract
        run: node tests/browser-demo-cloud-smoke.mjs
      - name: Chrome render of public demo as an ordinary anonymous visitor
        run: |
          python3 -m http.server 4185 --bind 127.0.0.1 --directory _site >/tmp/tamao-demo-http.log 2>&1 &
          SERVER=$!
          trap 'kill "$SERVER" 2>/dev/null || true' EXIT
          CHROME="$(command -v google-chrome || command -v chromium)"
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --window-size=1280,900 --virtual-time-budget=4500 \
            --user-data-dir="/tmp/tamao-web-demo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --dump-dom "http://127.0.0.1:4185/#home" > /tmp/tamao-demo-home.html
          grep -Fq "DEMONSTRAÇÃO INTERATIVA" /tmp/tamao-demo-home.html
          grep -Fq "Admin (resumo)" /tmp/tamao-demo-home.html
          grep -Fq "Revenda Parceira A" /tmp/tamao-demo-home.html || grep -Fq "Cotações" /tmp/tamao-demo-home.html
          ! grep -Fq "lgugwujpunhslavewffd" /tmp/tamao-demo-home.html

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
      issues: write
    steps:
      - uses: actions/checkout@v6
      - name: Build the SAME static assets (no secrets, no backend)
        run: node scripts/build-owner-browser-demo.mjs _site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload demo only
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy demo (never TAMÃO production)
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published link via public HTTP
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          case "$PAGE_URL" in
            https://carloskk07.github.io/gassg/*) ;;
            *) echo "Unexpected Pages origin: $PAGE_URL"; exit 1;;
          esac
          curl --fail --silent --show-error --location --retry 10 \
            --retry-all-errors --retry-delay 3 --connect-timeout 10 --max-time 25 \
            "$PAGE_URL" -o /tmp/tamao-demo-page.html
          curl --fail --silent --show-error --location --retry 6 \
            --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 25 \
            "${PAGE_URL}js/demo-browser-panel.js" -o /tmp/tamao-demo-script.js
          grep -Fq "Demonstração interativa (sem vendas reais)" /tmp/tamao-demo-page.html
          grep -Fq "DEMONSTRAÇÃO INTERATIVA" /tmp/tamao-demo-script.js
      - name: Record VERIFIED link only after public response
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo "🧪 **TAMÃO — demonstração web publicada e verificada por HTTP:** $PAGE_URL"
            echo
            echo "Não requer Docker, Windows nem instalação. Cliente e Revenda são simulações no mesmo navegador; Admin é resumo de leitura, não o Admin real. Sem sincronização entre aparelhos, banco comercial, Pix ou cobrança."
            echo
            echo "Deploy do commit $GITHUB_SHA, com HTTP público conferido após publicação."
          } > /tmp/tamao-demo-deploy-comment.md
          gh issue comment 493 --repo carloskk07/gassg --body-file /tmp/tamao-demo-deploy-comment.md
