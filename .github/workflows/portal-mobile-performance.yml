name: TAMÃO mobile performance diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'js/**'
      - 'css/**'
      - 'scripts/build-live-portals.mjs'
      - 'scripts/portal-mobile-performance.mjs'
      - '.github/workflows/portal-mobile-performance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tamao-mobile-performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CHAMA_CUSTOMER_ORIGIN: https://tamao.com.br
      CHAMA_MERCHANT_ORIGIN: https://parceiro.tamao.com.br
      CHAMA_ADMIN_ORIGIN: https://admin.tamao.com.br
      CHAMA_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      CHAMA_ALLOW_TEST_TURNSTILE: '1'
      CHAMA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
      - name: Build disposable isolated portal bundles
        run: node scripts/build-live-portals.mjs
      - name: Measure cold mobile starts (no production requests)
        run: |
          set -euo pipefail
          node --check scripts/portal-mobile-performance.mjs
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          python3 -m http.server 4186 --bind 127.0.0.1 --directory dist/live-portals >/tmp/tamao-perf-http.log 2>&1 &
          SERVER_PID=$!
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-background-networking --disable-dev-shm-usage \
            --remote-debugging-port=9226 --remote-debugging-address=127.0.0.1 \
            --user-data-dir=/tmp/tamao-perf-chrome --proxy-server=http://127.0.0.1:1 \
            --proxy-bypass-list=127.0.0.1 --host-resolver-rules='MAP * ~NOTFOUND, EXCLUDE 127.0.0.1' \
            about:blank >/tmp/tamao-perf-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill "$CHROME_PID" "$SERVER_PID" 2>/dev/null || true' EXIT
          node scripts/portal-mobile-performance.mjs
      - name: Archive diagnostic report only
        uses: actions/upload-artifact@v4
        with:
          name: tamao-mobile-performance-diagnostic
          path: dist/portal-mobile-performance.json
          if-no-files-found: error
          retention-days: 14
