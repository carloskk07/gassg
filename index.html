  <template id="tamao-coupon-terms-template">
  <p>Quando um pacote estiver disponível para compra, o TAMÃO informará antes do Pix o preço, a quantidade e o valor de cada desconto, o prazo de uso e a compra mínima. Cada cupom poderá ser utilizado uma vez, em apenas um pedido elegível, de acordo com o catálogo, a disponibilidade de revendas para o CEP e as regras informadas no pacote. A compra dos cupons não reserva produto, entrega nem disponibilidade de uma loja; os direitos de desconto ficam vinculados à conta do comprador.</p>
  <p>A validade é contada a partir da emissão dos cupons após pagamento confirmado. Os cupons não são resgatáveis em dinheiro nem representam saldo para saque. Em pedidos cancelados, a reserva do cupom é tratada conforme a situação financeira do pedido; reembolsos do pacote podem exigir análise quando já houve utilização. Para desistência, arrependimento, dúvidas e solicitação de cancelamento ou reembolso, use o canal oficial de atendimento; os direitos legais aplicáveis são preservados. Versão das condições de compra de cupons: clube_coupon_terms_v1_813.</p>
  </template>
