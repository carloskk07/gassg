# Edge Functions that must be reachable before a user session exists.
# Authorization for privileged actions remains enforced inside each handler.
[functions.admin-auth]
verify_jwt = false

[functions.capture-prelaunch-lead]
verify_jwt = false

[functions.submit-public-request]
verify_jwt = false

[functions.capture-marketing-event]
verify_jwt = false


# External payment provider adapter ingress.
# JWT is disabled because authenticity is enforced with a provider-specific HMAC signature.
[functions.billing-payment-webhook]
verify_jwt = false


# Native Woovi/OpenPix Pix-received adapter.
# JWT is disabled because authenticity is checked with Woovi RSA signature,
# a private webhook Authorization token and the bound Woovi company ID.
[functions.billing-payment-webhook-woovi]
verify_jwt = false


# Authenticated merchant billing endpoint that creates/retrieves provider Pix charges.
# JWT verification remains inside the function to support the project key model consistently.
[functions.merchant-billing-pix]
verify_jwt = false


# Mercado Pago billing webhook ingress for money owed to TAMÃO.
# JWT is disabled because authenticity is enforced by Mercado Pago HMAC
# and every event is re-fetched from the provider before reconciliation.
[functions.billing-payment-webhook-mercadopago]
verify_jwt = false


# Merchant payment connection management. JWT validation is performed inside
# the function so the same publishable-key/session model is used consistently.
[functions.merchant-payment-connect]
verify_jwt = false

# Mercado Pago redirects here before a TAMÃO user session exists.
# Authenticity is enforced by a one-time high-entropy OAuth state plus PKCE.
[functions.merchant-payment-oauth-callback]
verify_jwt = false
